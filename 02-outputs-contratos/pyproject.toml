[project]
name = "outputs-contratos"
version = "0.1.0"
description = "Exemplo didatico de contratos Pydantic em um workflow LangChain exposto por FastAPI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "langchain>=1.3.14",
    "langchain-google-genai>=4.4.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
