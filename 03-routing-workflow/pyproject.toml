[project]
name = "routing-workflow"
version = "0.1.0"
description = "Exemplo didatico de routing entre modelos OpenAI e Anthropic com LangChain"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "langchain-anthropic>=1.7.1",
    "langchain-core>=1.6.2",
    "langchain-openai>=1.6.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
